# Buduje plik APK (Android) z folderu svietovit-web/docs. Uruchamia się ręcznie (Actions → „APK” → Run workflow)
# oraz po każdej zmianie w docs/ lub android/. Gotowy plik: Actions → wybrany przebieg → Artifacts → svietovit-apk.
name: APK
on:
  workflow_dispatch:
  push:
    branches: [main, apk-android]
    paths: ["svietovit-web/docs/**", "android/**", ".github/workflows/apk.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Kopiuj stronę do aplikacji
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r svietovit-web/docs/. android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/sw.js
      - name: Buduj APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: svietovit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
